<!DOCTYPE html>
<html>
    <head>
        <title>Image HTML dan CSS</title>
        <link rel="stylesheet" href="image.css">
    </head>
    <body>
        <center>
        <p>ini adalah gambar ukuran normal</p>
        <!-- Cara menambahkan gambar, format image:.jpg/.jpeg/.png/.gif -->
         <img src="images.jpg" alt="Spiderman Brand New Day">

         <!-- Cara merubah ukuran Gambar -->
          <p>Ini adalah Gambar yang sudah di ganti ukuran</p>
          <img src="images.jpg" alt="Spiderman Brand New Day" class="ukuran">

          <!-- cara menambahkan lengkungan pada setiap sudut -->
           <p>ini adalah gambar yang sudah diberikan lengkungan </p>
           <img src="images.jpg" alt="Spiderman Brand New Day" class="lengkungan">

           <!-- cara menambahkan border pada gambar -->
            <p>ini adalah menambahkan border pada gambar</p>
            <img src="images.jpg" alt="Spiderman Brand New Day" class="border">

            <!-- cara menggabungkan gambar dan teks -->
             <div class="kelompok">
                <img src="images.jpg" alt="Spiderman Brand New Day">
                <p> Gambar Poster</p>
             </div>

             <!-- Cara menambahkan efek hover -->
              <div class="efek"> 
                <img src="images.jpg" alt="Spiderman Brand New Day">
                <p>ini contoh hover</p>

              </div>
            </center>
        </body>
</html>
